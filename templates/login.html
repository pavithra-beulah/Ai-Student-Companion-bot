<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Classroom Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">🤖</div>
        <h1 class="login-title">Classroom Companion</h1>
        <p class="login-subtitle">Enter credentials generated via the Telegram Bot</p>

        {% if error %}
            <div class="alert-error">{{ error }}</div>
        {% endif %}

        <form method="POST" id="login-form">
            <div class="mb-form">
                <label class="form-label-custom" for="role">Portal Workspace</label>
                <select name="role" id="role" class="form-select-custom" required>
                    <option value="student" selected>🎒 Student Dashboard</option>
                    <option value="teacher">🏫 Teacher Dashboard</option>
                </select>
            </div>
            <div class="mb-form">
                <label class="form-label-custom" for="username">Username</label>
                <input type="text" name="username" id="username" class="form-control-custom"
                    placeholder="e.g. rahul_s" required autocomplete="off">
            </div>
            <div class="mb-form">
                <label class="form-label-custom" for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control-custom"
                    placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="login-btn">Log In to Dashboard →</button>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
